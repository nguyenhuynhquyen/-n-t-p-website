<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduLearn-Nền tảng học tập trực tuyến</title>
    <link rel="stylesheet" href="baitap1.css" />
  </head>
  <body>
    <header>
      <h1>Quyên Academy</h1>
      <p id="title">Học lập trình cơ bản đến thực chiến</p>
    </header>
    <div class="banner">
      <p>Xin chào</p>
      <input type="text" placeholder="Nhập tên" id="nhap" />
      <button id="hello">Chào</button>
      <button id="color">Đổi màu tiêu đề</button>
      <button id="highlight">Nổi bật</button>
      <p id="result"></p>
    </div>
    <div class="course">
      <h2>Khóa học của tôi</h2>
      <div class="list">
        <div class="list-course">
          <h3>HTML & CSS</h3>
          <p>299.000đ</p>
          <button class="btn">Ẩn khóa học</button>
        </div>
        <div class="list-course2">
          <h3>Javascript</h3>
          <p>399.000đ</p>
          <button class="btn2">Ẩn khóa học</button>
        </div>
        <div class="list-course3">
          <h3>SQL Server</h3>
          <p>349.000đ</p>
          <button class="btn3">Ẩn khóa học</button>
        </div>
      </div>
    </div>
    <div class="button">
      <button class="hien">Hiện khóa học</button>
      <button class="them">Thêm khóa học</button>
    </div>
    <script src="baitap1.js"></script>
  </body>
</html>
